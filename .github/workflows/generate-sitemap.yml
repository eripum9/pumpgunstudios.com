name: Generate Sitemap

on:
  push:
    branches:
      - main
    paths:
      - "**/index.html"
      - ".github/scripts/generate_sitemap.py"
      - ".github/workflows/generate-sitemap.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sitemap-main
  cancel-in-progress: true

jobs:
  generate:
    name: Generate sitemap.xml
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate sitemap
        run: python .github/scripts/generate_sitemap.py

      - name: Commit changed sitemap
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- sitemap.xml sitemap.txt)" ]; then
            echo "Sitemaps are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml sitemap.txt
          git commit -m "chore: update sitemaps"
          git push
